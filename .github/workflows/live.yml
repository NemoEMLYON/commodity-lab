# Daily live update: today's volatility forecasts with the frozen models.
# Runs on weekdays after the US close, then republishes the site.
# Training stays offline (pipeline.R + freeze_models.R on the PC); this job
# only downloads prices and implied vol, predicts and writes live.json.
#
# No key needed: implied vol comes from FRED's public CSV export. Optional
# fallback: a repository secret FRED_API_KEY (Settings > Secrets and
# variables > Actions) lets the job try the FRED API if the export fails.
name: Daily live update

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Monday to Friday (US close + 1h30 in winter)
  workflow_dispatch:           # manual run from the Actions tab

permissions:
  contents: write              # commit live.json
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"         # same as renv.lock
          use-public-rspm: true      # precompiled Linux packages: minutes, not an hour

      - uses: r-lib/actions/setup-renv@v2   # installs renv.lock, cached between runs

      # Last successful download, kept between runs (not in Git: third-party
      # data). Used if Yahoo or FRED fail today.
      - uses: actions/cache@v4
        with:
          path: data/processed/live_snapshot.rds
          key: live-snapshot-${{ github.run_id }}
          restore-keys: live-snapshot-

      - name: Forecast with the frozen models
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript live.R

      - name: Commit live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/live.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Live update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # A push made by this workflow does not start pages.yml (GitHub rule for
  # its own token), so the site is published here.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # includes the commit made above
      - name: Check the simulator against the R reference cases
        run: node site/tests/test_simulator.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
